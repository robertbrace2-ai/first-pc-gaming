<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube | First PC Gaming</title>
  <meta name="description" content="Gameplay videos from First PC Gaming and Andy — sim racing, golf, cricket and more.">
  <link rel="icon" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="videos">
  <header id="site-header"></header>

  <main>
    <div class="wrap page-head yt-head">
      <span class="eyebrow">YouTube</span>
      <h1>First PC Gaming YouTube Channel</h1>
    </div>

    <section class="player-section" id="player-section">
      <div class="wrap player-layout">
        <div class="player" id="player"></div>
        <div class="now-playing">
          <div>
            <span class="eyebrow" style="margin-bottom:.3em">Now playing</span>
            <h1 id="np-title"></h1>
            <span class="muted" id="np-owner"></span>
          </div>
          <a class="btn btn-ghost btn-sm" id="np-youtube" href="#" target="_blank" rel="noopener">Watch on YouTube ↗</a>
        </div>
      </div>
    </section>

    <section style="padding-top:24px">
      <div class="wrap">
        <div class="tabs" role="tablist" id="channel-tabs"></div>
        <div class="channel-info" id="channel-info"></div>
        <div class="vgrid" id="video-grid"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/site-data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
